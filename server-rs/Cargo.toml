[package]
name = "filebrowser"
version = "3.1.3"
edition = "2021"
description = "Modern file browser server (Rust port)"
license = "ISC"
publish = false

[lib]
name = "fbcore"
path = "src/lib.rs"

[[bin]]
name = "filebrowser"
path = "src/main.rs"

# The same server in its own desktop window (Windows)
[[bin]]
name = "filebrowser-app"
path = "src/bin/filebrowser-app.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
dunce = "1"
dotenvy = "0.15"
form_urlencoded = "1"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
tar = "0.4"
flate2 = "1"
unrar = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
jpeg-decoder = "0.3"
lopdf = "0.34"
socket2 = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# The desktop window (filebrowser-app): WebView2, which Windows 10/11 ship
[target.'cfg(windows)'.dependencies]
wry = "0.58.0"
tao = "0.38.0"
rfd = "0.18.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
